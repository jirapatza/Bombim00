name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing production Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate required deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: a95b2f6bee36ee81dbfb9f3a7c56ffa8
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          if [[ ! "$CF_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character account id from the Cloudflare dashboard URL, not a Workers or Pages hostname"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        working-directory: cloudflare
        run: npm ci
      - name: Run tests
        working-directory: cloudflare
        run: npm test
      - name: Generate production config from checked-in configuration
        working-directory: cloudflare
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'bombim00-lottery-checker') throw Error('Unexpected Worker name');
          if (config.d1_databases?.length !== 1 || config.d1_databases[0].binding !== 'DB') throw Error('Unexpected D1 bindings');
          config.d1_databases[0].database_id = '6a4a88e4-8eca-4291-a23b-d58caf0a236e';
          config.vars = { ...config.vars, MODE: 'deliver', ENABLED: 'true' };
          config.observability = { enabled: true };
          fs.writeFileSync('wrangler.production.json', JSON.stringify(config, null, 2));
          NODE
      - name: Build Worker
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.production.json --outdir dist
      - name: Deploy Worker to production
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a95b2f6bee36ee81dbfb9f3a7c56ffa8
        run: npx wrangler deploy --config wrangler.production.json
