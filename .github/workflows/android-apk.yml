name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - "data/**"
      - "tsconfig.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: bombim00-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine next APK version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/latest-apk" || echo '{"assets":[]}')
          CURRENT_VERSION=$(echo "$RELEASE_JSON" | jq -r '[.assets[]?.name | select(test("^Bombim00-v[0-9]+\\.apk$")) | capture("^Bombim00-v(?<version>[0-9]+)\\.apk$").version | tonumber] | max // 0')
          NEXT_VERSION=$((CURRENT_VERSION + 1))
          echo "APP_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NEXT_VERSION" >> "$GITHUB_ENV"
          echo "Next APK version: v$NEXT_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install web dependencies
        run: npm install

      - name: Type-check web application
        run: npm run lint


      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/cli@^8 @capacitor/android@^8

      - name: Build web application
        run: npm run build

      - name: Generate Android wrapper
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android version for upgrade installs
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+['\\"][^'\\"]+['\\"]/versionName '${VERSION_NAME}'/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare versioned APK file
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/Bombim00-v${APP_VERSION}.apk"
          ls -lh "release-assets/Bombim00-v${APP_VERSION}.apk"

      - name: Upload installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bombim00-v${{ env.APP_VERSION }}-APK
          path: release-assets/Bombim00-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-apk
          name: "Bombim00 Android App (Latest APK)"
          body: |
            ## 📱 Bombim00 - ระบบตรวจและแจ้งเตือนผลหวยสด (Android APK)
            ไฟล์ติดตั้งแอปพลิเคชัน Android พร้อมเสียงประกาศผลภาษาไทยและแจ้งเตือนอัตโนมัติ

            ### 📥 ลิงก์ดาวน์โหลด:
            - ดาวน์โหลดไฟล์รุ่นนี้: **[Bombim00-v${{ env.APP_VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/Bombim00-v${{ env.APP_VERSION }}.apk)**

            ### 🚀 วิธีการติดตั้งบนมือถือ Android:
            1. ดาวน์โหลดไฟล์ `Bombim00-v${{ env.APP_VERSION }}.apk` ลงในโทรศัพท์
            2. แตะเปิดไฟล์ APK แล้วเลือก "ติดตั้ง" (Install)
            3. หากระบบถาม ให้เลือก "อนุญาตการติดตั้งจากแหล่งที่ไม่รู้จัก" (Allow from this source)
            4. เปิดแอปและเริ่มใช้งานระบบแจ้งเตือนสลากได้ทันที!
          files: release-assets/Bombim00-v${{ env.APP_VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
