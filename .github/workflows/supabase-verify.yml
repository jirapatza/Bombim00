name: Verify Supabase migration parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bombim00-lottery-alert
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Checkout latest main JSON snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-snapshot
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and database parity (read-only)
        env:
          BOMBIM00_SOURCE_ROOT: ${{ github.workspace }}/main-snapshot
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/verify_supabase_migration.py
