name: Update 54 lottery results

# Refreshes data/all_lotteries.json from public sources, verifies it, then
# commits only the runtime data files to the runtime-live branch.

on:
  schedule:
    - cron: "20 20 * * *" # 03:20 Asia/Bangkok, after the last daily draw
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for the newest result"
        required: false
        default: "4"
      dry_run:
        description: "Collect and validate without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-all-lotteries
  cancel-in-progress: false

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python regression tests
        run: PYTHONPATH=. pytest tests/ -q

  collect:
    name: Collect, validate and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: code
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect with bounded retries
        working-directory: code
        env:
          DAYS: ${{ inputs.days || '4' }}
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "collector attempt ${attempt}/3"
            if python scripts/collect_all_lotteries.py --days "$DAYS"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::collector failed after 3 attempts"
          exit 1

      - name: Validate before publishing
        working-directory: code
        run: python scripts/validate_all_lotteries.py

      - name: Report coverage
        working-directory: code
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('data/all_lotteries_report.json', encoding='utf-8'))
          print(f"### Lottery coverage\n")
          print(f"- total: {report['total']}")
          print(f"- verified: {report['verified']}")
          print(f"- without evidence: {report['not_found']}\n")
          if report['missing']:
              print("| id | name | reason |")
              print("| --- | --- | --- |")
              for row in report['missing']:
                  print(f"| {row['id']} | {row['name']} | {row['reason']} |")
          PY

      - name: Checkout runtime-live data branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: runtime-live
          path: runtime
          fetch-depth: 0

      - name: Publish data files to runtime-live
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          cp code/data/all_lotteries.json runtime/data/all_lotteries.json
          cp code/data/all_lotteries_evidence.json runtime/data/all_lotteries_evidence.json
          cp code/data/all_lotteries_report.json runtime/data/all_lotteries_report.json
          cd runtime
          git config user.name "bombim00-bot"
          git config user.email "bombim00-bot@users.noreply.github.com"
          git add data/all_lotteries.json data/all_lotteries_evidence.json data/all_lotteries_report.json
          if git diff --cached --quiet; then
            echo "No data changes to publish"
            exit 0
          fi
          git commit -m "chore(bot): update 54 lottery results [skip ci] [skip render]"
          for attempt in 1 2 3; do
            if git push origin HEAD:runtime-live; then
              echo "pushed to runtime-live"
              exit 0
            fi
            echo "push attempt ${attempt} failed, rebasing"
            git fetch origin runtime-live
            git rebase FETCH_HEAD || git rebase --abort
            sleep 5
          done
          echo "::error::could not push to runtime-live after 3 attempts"
          exit 1
