name: Lottery source contract probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - lottery_checker.py
      - scripts/probe_lotterychecks.py
      - .github/workflows/lottery-source-probe.yml

permissions:
  contents: read

concurrency:
  group: lottery-source-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify latest public Lao and Hanoi contracts without notifications
        run: python scripts/probe_lotterychecks.py
