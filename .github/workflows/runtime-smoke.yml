name: Web and checker smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "config/**"
      - "status/**"
      - "lottery_previous_results.json"
      - "package*.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "lottery_checker.py"
      - "draw_schedule.py"
      - "lottery_worker.py"
      - "Dockerfile.worker"
      - "render.yaml"
      - "deploy/start_worker.py"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend data tests
        run: npm test

      - name: Build static web app
        run: npm run build

      - name: Verify static build output
        run: test -s dist/index.html

      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Exercise buttons and routes in desktop and mobile Chromium
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/bombim-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node tests/browser-smoke.mjs

      - name: Inspect production Worker health (GET only; no ntfy or D1 writes)
        id: health_probe
        continue-on-error: true
        run: node tests/read-only-health.mjs

      - name: Report Access-protected health check
        if: steps.health_probe.outcome == 'failure'
        run: echo "::warning::Production /health was not independently verified; Cloudflare Access requires sign-in. Browser tests remain separately checked."

      - name: Install checker dependencies and run Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q lottery_checker.py settings_loader.py draw_schedule.py lottery_worker.py deploy/start_worker.py
          python -m pytest -q tests
