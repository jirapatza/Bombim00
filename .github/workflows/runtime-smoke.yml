name: Web and checker smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "config/**"
      - "status/**"
      - "lottery_previous_results.json"
      - "package*.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "lottery_checker.py"
      - "draw_schedule.py"
      - "lottery_worker.py"
      - "Dockerfile.worker"
      - "render.yaml"
      - "deploy/start_worker.py"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend data tests
        run: npm test

      - name: Build static web app
        run: npm run build

      - name: Verify static build output
        run: test -s dist/index.html

      - name: Install checker dependencies and run Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q lottery_checker.py settings_loader.py draw_schedule.py lottery_worker.py deploy/start_worker.py
          python -m pytest -q tests
