name: Runtime Smoke Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "lottery_previous_results.json"
      - "status/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "lottery_checker.py"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/runtime-smoke.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install checker dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile checker
        run: python -m compileall -q lottery_checker.py settings_loader.py

      - name: Run checker regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
