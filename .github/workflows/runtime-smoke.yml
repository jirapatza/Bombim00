name: Web and checker smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "config/**"
      - "status/**"
      - "lottery_previous_results.json"
      - "package*.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "lottery_checker.py"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend data tests
        run: npm test

      - name: Build static web app
        run: npm run build

      - name: Verify static build output
        run: test -s dist/index.html

      - name: Install checker dependencies and run Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q lottery_checker.py settings_loader.py
          python -m pytest -q tests
