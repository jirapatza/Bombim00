name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only ever deploy from main, even when started manually
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: a95b2f6bee36ee81dbfb9f3a7c56ffa8
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          if [[ ! "$CF_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character account id from the Cloudflare dashboard URL, not a Workers or Pages hostname"
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Never publish a build that fails type-checking or the frontend tests.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Project bombim00 already exists. Never try to recreate it on each push.
      # Retry only Cloudflare's transient upstream/API failures (not auth/config errors).
      - name: Deploy to existing Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a95b2f6bee36ee81dbfb9f3a7c56ffa8
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Cloudflare Pages deploy attempt ${attempt}/4"
            if npx --yes wrangler@4.158.0 pages deploy dist --project-name=bombim00 --branch=main 2>&1 | tee /tmp/pages-deploy.log; then
              echo "Cloudflare Pages deployment succeeded"
              exit 0
            fi

            # Do not conceal a wrong token, missing project, or a build failure.
            if ! grep -Eqi 'Received a malformed response from the API|no healthy upstream|HTTP (500|502|503|504)|code: 5(00|02|03|04)' /tmp/pages-deploy.log; then
              echo "::error::Non-transient Pages deployment failure; no retry"
              exit 1
            fi

            if (( attempt == 4 )); then
              echo "::error::Cloudflare Pages API remained unavailable after four attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
