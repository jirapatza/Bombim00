name: Lottery Alert Checker

on:
  schedule:
    # Poll every 5 minutes; GitHub may delay scheduled workflows.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'

concurrency:
  group: bombim00-lottery-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/

      - name: Run Lottery Checker & Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          python lottery_checker.py

      - name: Commit and Push Status & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add status/status.json lottery_previous_results.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): update lottery results and status [skip ci]"
            git push
          fi
