# Production lottery polling and ntfy delivery run on Cloudflare Workers only.
# Keep this workflow as a pull-request Python regression check; never publish runtime results here.
name: Lottery Alert Checker

on:
  pull_request:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "draw_schedule.py"
      - "lottery_worker.py"
      - "cloudflare/**"
      - "data/draw_weekdays.json"
      - "data/all_lotteries.json"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/lottery.yml"

permissions:
  contents: read

jobs:
  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python regression tests (no notifications)
        run: |
          PYTHONPATH=. pytest tests/
