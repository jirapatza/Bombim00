name: Lottery Alert Checker

on:
  push:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "settings_loader.py"
      - "config/settings.json"
      - "tests/**"
      - ".github/workflows/lottery.yml"
      - "src/**"
      - "package.json"
      - "vite.config.ts"
  schedule:
    # Poll every 5 minutes; GitHub may delay scheduled workflows.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'
      test_notification:
        description: 'Send one test message to ntfy (does not claim phone receipt)'
        required: false
        type: boolean
        default: false

concurrency:
  group: bombim00-lottery-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Type-check web app
        run: npm run lint
      - name: Build web app
        run: npm run build

  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main with latest deduplication history
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      # One-time notification test; this marker is used for this run only.
      - name: Send one-time VIP alert and sound test
        if: (github.event_name == 'workflow_dispatch' && inputs.test_notification) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-notification]'))
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC secret is not configured; skipping the notification test."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 20 \
            -H "Title: ทดสอบเสียงแจ้งเตือนหุ้น VIP" \
            -H "Priority: urgent" \
            -H "Tags: loudspeaker,bell" \
            -H "Click: https://github.com/jirapatza/Bombim00/actions" \
            -d "นี่คือข้อความทดสอบเท่านั้น ไม่ใช่ผลหวยจริง\nระบบส่งจาก GitHub Actions ไปยัง ntfy แล้ว\nถ้าต้องการให้พูดออกเสียง ให้เปิดเสียงการแจ้งเตือนของ ntfy ใน Android; ntfy ไม่สามารถสั่งเสียงพูดไทยเองจาก GitHub ได้" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo "NTFY_HTTP_ACCEPTED=1 (server accepted the publish request; Android receipt is not verifiable here)"

      - name: Check notification secret configuration
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC secret is not configured; push notifications will be skipped until it is added."
          fi

      - name: Run Lottery Checker & Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          python lottery_checker.py

      - name: Commit and Push Status & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add status/status.json lottery_previous_results.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): update lottery results and status [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push raced with another run; rebasing on latest main (attempt $attempt/3)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Cannot safely merge concurrent result-history updates; refusing to overwrite deduplication history." >&2
                exit 1
              fi
            done
            echo "Push failed after 3 attempts." >&2
            exit 1
          fi
