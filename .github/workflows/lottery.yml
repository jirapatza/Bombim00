name: Lottery Alert Checker

on:
  schedule:
    # Run every 15 minutes between 14:00 - 17:00 UTC+7 (07:00 - 10:00 UTC) on 1st and 16th of each month
    - cron: '*/15 7-10 1,16 * *'
    # Optional daily heartbeat at 09:00 UTC (16:00 UTC+7) to ensure system is alive
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/

      - name: Run Lottery Checker & Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          python lottery_checker.py

      - name: Commit and Push Status & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add status/status.json lottery_previous_results.json config/settings.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): update lottery results and status [skip ci]"
            git push
          fi
