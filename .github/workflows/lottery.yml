name: Lottery Alert Checker

on:
  push:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "settings_loader.py"
      - "config/settings.json"
      - "tests/**"
      - ".github/workflows/lottery.yml"
      - "src/**"
      - "package.json"
      - "vite.config.ts"
  schedule:
    # Poll every 5 minutes; GitHub may delay scheduled workflows.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'

concurrency:
  group: bombim00-lottery-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Type-check web app
        run: npm run lint
      - name: Build web app
        run: npm run build

  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Lottery Checker & Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          python lottery_checker.py

      - name: Commit and Push Status & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add status/status.json lottery_previous_results.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): update lottery results and status [skip ci]"
            git push
          fi
