name: Lottery Checker PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "draw_schedule.py"
      - "lottery_worker.py"
      - "cloudflare/**"
      - "data/draw_weekdays.json"
      - "data/all_lotteries.json"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/lottery.yml"

concurrency:
  group: bombim00-lottery-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/
