name: Lottery Alert Checker

on:
  push:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "settings_loader.py"
      - "config/settings.json"
      - "tests/**"
      - ".github/workflows/lottery.yml"
      - "src/**"
      - "package.json"
      - "vite.config.ts"
  schedule:
    # Poll every 5 minutes; GitHub may delay scheduled workflows.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'
      test_notification:
        description: 'Send one test message to ntfy (does not claim phone receipt)'
        required: false
        type: boolean
        default: false

concurrency:
  group: bombim00-lottery-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Type-check web app
        run: npm run lint
      - name: Build web app
        run: npm run build

  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main with latest deduplication history
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Send one-time ntfy connectivity test
        if: (github.event_name == 'workflow_dispatch' && inputs.test_notification) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-notification]'))
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'lottery-auto-alert-bb26-7f4c9d2e-6a1f-4c0b-8d37-91e2a6c5b740' }}
        run: |
          set -euo pipefail
          test -n "$NTFY_TOPIC"
          curl --fail --show-error --silent --max-time 20 \
            -H "Title: Lottery Alert connectivity test" \
            -H "Priority: high" \
            -H "Tags: bell" \
            -d "ทดสอบระบบ Bombim00: GitHub Actions ส่งคำขอไปยัง ntfy แล้ว หากไม่เห็นบนมือถือ ให้ตรวจการสมัคร Topic และสิทธิ์แจ้งเตือนใน Android" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo "NTFY_HTTP_ACCEPTED=1 (server accepted the publish request; Android receipt is not verifiable here)"

      - name: Run Lottery Checker & Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'lottery-auto-alert-bb26-7f4c9d2e-6a1f-4c0b-8d37-91e2a6c5b740' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          python lottery_checker.py

      - name: Commit and Push Status & Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add status/status.json lottery_previous_results.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): update lottery results and status [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push raced with another run; rebasing on latest main (attempt $attempt/3)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Cannot safely merge concurrent result-history updates; refusing to overwrite deduplication history." >&2
                exit 1
              fi
            done
            echo "Push failed after 3 attempts." >&2
            exit 1
          fi
