name: Lottery Alert Checker
run-name: ${{ inputs.request_id && format('Dashboard check {0}', inputs.request_id) || 'Lottery Alert Checker' }}

on:
  push:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "draw_schedule.py"
      - "lottery_worker.py"
      - "cloudflare/**"
      - "data/draw_weekdays.json"
      - "data/all_lotteries.json"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/lottery.yml"
  pull_request:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "draw_schedule.py"
      - "lottery_worker.py"
      - "cloudflare/**"
      - "data/draw_weekdays.json"
      - "data/all_lotteries.json"
      - "settings_loader.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/lottery.yml"
  schedule:
    # Keep a five-minute cadence away from the top-of-hour scheduling peak.
    # GitHub can still delay or drop scheduled runs.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'
      lottery_target:
        description: 'Lottery category to check and notify'
        required: false
        type: choice
        options:
          - all
          - vip
          - foreign_stock
          - hanoi
          - lao
          - thai_stock
          - government
          - malay
        default: all
      request_id:
        description: 'Unique ID to track dashboard-triggered runs'
        required: false
        type: string
        default: ''
      test_notification:
        description: 'Send one test message to ntfy (does not claim phone receipt)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('bombim00-lottery-pr-{0}', github.event.pull_request.number) || 'bombim00-lottery-alert' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-lottery:
    if: github.event_name == 'pull_request' || (vars.LOTTERY_CHECKER_MODE != 'continuous' && vars.LOTTERY_CHECKER_MODE != 'cloudflare')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Load runtime data without replacing reviewed application code
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin runtime-live
          git checkout FETCH_HEAD -- config/settings.json data/all_lotteries.json lottery_previous_results.json status/status.json


      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      # One-time notification test; only an explicit [test-notification] commit sends one test message.
      - name: Send one-time VIP alert and sound test
        if: (github.event_name == 'workflow_dispatch' && inputs.test_notification) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-notification]'))
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          readarray -t NTFY_CONFIG < <(python -c 'import json; c=json.load(open("config/settings.json", encoding="utf-8")); n=c.get("channels", {}).get("ntfy", {}); print(n.get("server", "https://ntfy.sh")); print(n.get("topic", ""))')
          NTFY_SERVER="${NTFY_SERVER:-${NTFY_CONFIG[0]}}"
          TOPIC="${NTFY_TOPIC:-${NTFY_CONFIG[1]}}"
          if [ -z "$TOPIC" ]; then
            echo "::warning::No ntfy topic is configured in the Actions secret or config/settings.json; skipping the notification test."
            exit 0
          fi
          if [[ ! "$TOPIC" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "::error::Configured ntfy topic contains unsupported characters."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 20 \
            -H "Title: ทดสอบเสียงแจ้งเตือนหุ้น VIP" \
            -H "Priority: urgent" \
            -H "Tags: loudspeaker,bell" \
            -H "Click: https://github.com/jirapatza/Bombim00/actions" \
            -d "นี่คือข้อความทดสอบเท่านั้น ไม่ใช่ผลหวยจริง\nระบบส่งจาก GitHub Actions ไปยัง ntfy แล้ว\nถ้าต้องการให้พูดออกเสียง ให้เปิดเสียงการแจ้งเตือนของ ntfy ใน Android; ntfy ไม่สามารถสั่งเสียงพูดไทยเองจาก GitHub ได้" \
            "${NTFY_SERVER%/}/$TOPIC"
          echo "NTFY_HTTP_ACCEPTED=1 (server accepted the publish request; Android receipt is not verifiable here)"

      - name: Check notification secret configuration
        if: github.event_name != 'pull_request'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          CONFIG_TOPIC="$(python -c 'import json; print(json.load(open("config/settings.json", encoding="utf-8")).get("channels", {}).get("ntfy", {}).get("topic", ""))')"
          if [ -z "${NTFY_TOPIC:-$CONFIG_TOPIC}" ]; then
            echo "::warning::No ntfy topic is configured; automatic push delivery cannot be sent."
          else
            echo "ntfy destination is configured (topic value hidden)."
          fi

      - name: Run Lottery Checker & Alert
        if: github.event_name != 'pull_request'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
          LOTTERY_TARGET: ${{ github.event.inputs.lottery_target || 'all' }}
        run: |
          python lottery_checker.py

      - name: Commit only results to the runtime data branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_DIR="$(mktemp -d)"
          trap 'git worktree remove --force "$DATA_DIR" 2>/dev/null || true' EXIT
          git fetch origin runtime-live
          git worktree add --detach "$DATA_DIR" origin/runtime-live
          mkdir -p "$DATA_DIR/status"
          cp status/status.json "$DATA_DIR/status/status.json"
          cp lottery_previous_results.json "$DATA_DIR/lottery_previous_results.json"
          cd "$DATA_DIR"
          git add -- status/status.json lottery_previous_results.json
          if git diff --staged --quiet; then
            echo "No runtime data changes to commit."
            exit 0
          fi
          git commit -m "chore(bot): update lottery results and status [skip ci] [skip render]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/runtime-live; then
              exit 0
            fi
            git fetch origin runtime-live
            if ! git rebase origin/runtime-live; then
              git rebase --abort || true
              echo "Concurrent result changes conflict; refusing to overwrite notification history." >&2
              exit 1
            fi
          done
          exit 1
