name: Lottery Alert Checker
run-name: ${{ inputs.request_id && format('Dashboard check {0}', inputs.request_id) || 'Lottery Alert Checker' }}

on:
  push:
    branches: [main]
    paths:
      - "lottery_checker.py"
      - "settings_loader.py"
      - "tests/**"
      - ".github/workflows/lottery.yml"
  schedule:
    # Poll every 5 minutes; GitHub may delay scheduled workflows.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force dispatch notification even if already sent'
        required: false
        default: 'false'
      lottery_target:
        description: 'Lottery category to check and notify'
        required: false
        type: choice
        options:
          - all
          - vip
          - foreign_stock
          - hanoi
          - lao
          - thai_stock
          - government
          - malay
        default: all
      request_id:
        description: 'Unique ID to track dashboard-triggered runs'
        required: false
        type: string
        default: ''
concurrency:
  group: bombim00-lottery-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load runtime data without replacing reviewed application code
        run: |
          set -euo pipefail
          git fetch origin runtime-live
          git checkout FETCH_HEAD -- config/settings.json data/all_lotteries.json lottery_previous_results.json status/status.json


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Check notification secret configuration
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          CONFIG_TOPIC="$(python -c 'import json; print(json.load(open("config/settings.json", encoding="utf-8")).get("channels", {}).get("ntfy", {}).get("topic", ""))')"
          if [ -z "${NTFY_TOPIC:-$CONFIG_TOPIC}" ]; then
            echo "::warning::No ntfy topic is configured; automatic push delivery cannot be sent."
          else
            echo "ntfy destination is configured (topic value hidden)."
          fi

      - name: Run Lottery Checker & Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
          LOTTERY_TARGET: ${{ github.event.inputs.lottery_target || 'all' }}
        run: |
          python lottery_checker.py

      - name: Commit only results to the runtime data branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_DIR="$(mktemp -d)"
          trap 'git worktree remove --force "$DATA_DIR" 2>/dev/null || true' EXIT
          git fetch origin runtime-live
          git worktree add --detach "$DATA_DIR" origin/runtime-live
          mkdir -p "$DATA_DIR/status"
          cp status/status.json "$DATA_DIR/status/status.json"
          cp lottery_previous_results.json "$DATA_DIR/lottery_previous_results.json"
          cd "$DATA_DIR"
          git add -- status/status.json lottery_previous_results.json
          if git diff --staged --quiet; then
            echo "No runtime data changes to commit."
            exit 0
          fi
          git commit -m "chore(bot): update lottery results and status [skip ci] [skip render]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/runtime-live; then
              exit 0
            fi
            git fetch origin runtime-live
            if ! git rebase origin/runtime-live; then
              git rebase --abort || true
              echo "Concurrent result changes conflict; refusing to overwrite notification history." >&2
              exit 1
            fi
          done
          exit 1
