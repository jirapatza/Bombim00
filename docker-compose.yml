version: '3.8'

services:
  lottery-alert:
    build: .
    container_name: lottery-alert-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DASH_PASSWORD=${DASH_PASSWORD:?Set DASH_PASSWORD before starting}
    volumes:

